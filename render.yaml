# Render Blueprint for LabShare — single Web Service serving the API + the
# built React app (user FE + admin FE) from one origin.
#
# To deploy:
#   1. Create a Neon Postgres database and copy its connection string.
#   2. Add the repo as a Render Blueprint: Dashboard -> New -> Blueprint ->
#      connect this repo. Render reads this file and creates the service.
#   3. On the service, set the env vars listed below (DATABASE_URL, JWT_SECRET;
#      they are sync:false so Render prompts for the values).
#
# Design: everything heavy (root deps, frontend build, server deps, Prisma
# client generation) runs in the BUILD phase; the START command is thin —
# it applies migrations then launches Express, which also serves dist/.
# This avoids re-installing/re-building at runtime (fragile on Render).

services:
  - type: web
    name: labshare
    runtime: node
    plan: free
    region: singapore
    buildCommand: |
      export NODE_OPTIONS="--max-old-space-size=1024"
      npm install
      npm run build
      cd server && npm install && npx prisma generate
    startCommand: |
      cd server && npx prisma migrate deploy && node src/index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false   # paste your Neon connection string in Render
      - key: JWT_SECRET
        sync: false   # long random string, e.g. openssl rand -hex 32
